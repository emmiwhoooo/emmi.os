name: fix-namespace
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the @namespace line clobbered by an over-broad sed
        run: |
          set -e
          sed -i '3s/.*/@namespace   em.savepoint/' savepoint/savepoint.user.css
          head -8 savepoint/savepoint.user.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore @namespace em.savepoint"
          git push
