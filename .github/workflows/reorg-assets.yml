name: reorg-assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move save point assets into savepoint/assets
        run: |
          set -e
          mkdir -p savepoint/assets
          git mv assets/* savepoint/assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move save point assets into savepoint/assets"
          git push
