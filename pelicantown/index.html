<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelican Town</title>
<meta name="apple-mobile-web-app-title" content="Pelican Town">
<meta name="theme-color" content="#8a4f27">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // Home-screen launcher for valley.log (Em's Stardew tracker, inside the arcade).
  // Opened from the home-screen icon, the URL carries ?go=1 and we jump straight
  // to the tracker in Safari, where she's signed in to Claude. Opened any other
  // way, the page shows the one-time "add to home screen" steps instead.
  var TRACKER = "https://claude.ai/artifact/XxfCjmZADHq3QWu9DbMPre#valley";
  if (/[?&]go=1\b/.test(location.search)) location.replace(TRACKER);
</script>
<style>
  :root { --wood:#8a4f27; --wood-hi:#b87440; --wood-lo:#4a2814; --paper:#f6dea6; --paper-hi:#fff6dc; --ink:#4a2814; --leaf:#54803e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--wood) repeating-linear-gradient(to bottom, transparent 0 46px, #6e3c1e 46px 50px);
    color: var(--ink); font: 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    display: grid; place-items: center;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--paper);
    border: 4px solid var(--wood-lo); box-shadow: inset 0 0 0 4px var(--wood-hi), 0 6px 0 rgba(0,0,0,.25);
    padding: 26px 22px 22px; text-align: center;
  }
  img.icon { width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid var(--wood-lo); }
  h1 { font-size: 22px; letter-spacing: .14em; margin: 14px 0 4px; text-transform: uppercase; }
  .sub { margin: 0 0 18px; opacity: .8; font-size: 14px; }
  ol { text-align: left; margin: 0 0 20px; padding-left: 22px; }
  li { margin: 8px 0; }
  li b { white-space: nowrap; }
  .go {
    display: inline-block; text-decoration: none; color: var(--paper-hi); background: var(--leaf);
    border: 3px solid var(--wood-lo); box-shadow: inset -3px -3px 0 #3d5f2c, inset 3px 3px 0 #88c060;
    padding: 10px 18px; font-weight: 700; letter-spacing: .06em;
  }
  .note { font-size: 12.5px; opacity: .7; margin-top: 16px; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon-192.png" alt="">
    <h1>Pelican Town</h1>
    <p class="sub">your valley.log, one tap from the home screen</p>
    <ol>
      <li>Open this page in <b>Safari</b>.</li>
      <li>Tap the <b>Share</b> button (square with an arrow).</li>
      <li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
    </ol>
    <a class="go" id="go" href="#">open the farm ▸</a>
    <p class="note">Make sure you're signed in to claude.ai in Safari. The icon opens your tracker there.</p>
  </main>
  <script>
    document.getElementById("go").href = TRACKER;
    // Whatever Safari saves to the home screen should carry ?go=1.
    try { history.replaceState(null, "", location.pathname + "?go=1"); } catch (e) {}
  </script>
</body>
</html>
