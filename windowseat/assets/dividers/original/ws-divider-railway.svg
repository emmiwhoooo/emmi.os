<style>

@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes blink{0%,66%,100%{opacity:1}72%,82%{opacity:.25}}
@keyframes roll{0%{transform:translateX(-460px)}100%{transform:translateX(760px)}}
@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.sway{animation:sway 4.4s ease-in-out infinite}
.bob{animation:bob 3.6s ease-in-out infinite}
.blink{animation:blink 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:18s!important}}
</style>
